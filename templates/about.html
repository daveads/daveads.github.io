{% extends "base.html" %}

{% block title %}
{{ config.title }} - {{ page.title }}
{% endblock title %}

{% block extra_head %}
<link rel="stylesheet" href="{{ get_url(path='assets/css/about.css') }}">
{% endblock extra_head %}

{% block content %}
<article class="about-page">
  <header class="about-header">
    <p>~/about</p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="about-content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
