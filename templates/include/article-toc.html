{% if page.extra?.toc and page.toc %}
<nav class="article-toc" aria-labelledby="article-toc-title">
  <p class="article-toc__title" id="article-toc-title">On this page</p>
  <ul>
    {% for heading in page.toc %}
    <li>
      <a href="{{ heading.permalink | safe }}">{{ heading.title }}</a>
      {% if heading.children %}
      <ul>
        {% for child in heading.children %}
        <li><a href="{{ child.permalink | safe }}">{{ child.title }}</a></li>
        {% endfor %}
      </ul>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</nav>
{% endif %}
