{% component tip(header="") %}
<aside class="callout tip"{% if header %} aria-label="{{ header }}"{% endif %}>
{% set icon = load_data(path="static/icon/tip.svg") %}
<div class="icon" aria-hidden="true">
{{ icon | safe }}
</div>
<div class="content">
{% if header %}<p class="callout-title">{{ header }}</p>{% endif %}
{{ body | markdown | safe }}
</div>
</aside>
{% endcomponent tip %}
