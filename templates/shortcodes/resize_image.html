{% component resize_image(src, alt="", w="1024", h="") %}
{% if h %}
{% set image = resize_image(path="assets/images/" ~ src, width=w | int, height=h | int) %}
{% else %}
{% set image = resize_image(path="assets/images/" ~ src, width=w | int) %}
{% endif %}
<figure class="centered-image">
<img src="{{ image.url }}"{% if alt %} alt="{{ alt | safe }}"{% endif %}{% if w %} width="{{ w }}"{% endif %}{% if h %} height="{{ h }}"{% endif %} loading="lazy">
{% if alt %}<figcaption>{{ alt | safe }}</figcaption>{% endif %}
</figure>
{% endcomponent resize_image %}
